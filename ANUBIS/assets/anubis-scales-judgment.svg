<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="scaleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#b88a2a;stop-opacity:0"/>
    </radialGradient>
    <filter id="jewelGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Scales of Justice (Anubis's scales for weighing hearts) -->
  <!-- Beam (top horizontal bar) -->
  <rect x="50" y="50" width="100" height="4" fill="#0d0d0d" rx="2"/>
  
  <!-- Left pan (upper weight) -->
  <g transform="translate(75, 70)">
    <ellipse cx="0" cy="0" rx="20" ry="8" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="-18" y1="0" x2="-18" y2="40" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="8" x2="0" y2="40" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <line x1="18" y1="0" x2="18" y2="40" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <!-- Chain connecting to beam -->
    <line x1="-10" y1="-8" x2="-10" y2="-20" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-8" x2="0" y2="-20" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="-8" x2="10" y2="-20" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Right pan (soul being weighed) -->
  <g transform="translate(125, 75)">
    <ellipse cx="0" cy="0" rx="18" ry="6" fill="#1a1a1a" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="-15" y1="0" x2="-15" y2="35" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="6" x2="0" y2="35" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <line x1="15" y1="0" x2="15" y2="35" stroke="#d4af37" stroke-width="2" opacity="0.8"/>
    <!-- Chain connecting to beam -->
    <line x1="-8" y1="-6" x2="-8" y2="-18" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-6" x2="0" y2="-18" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="-6" x2="8" y2="-18" stroke="#d4af37" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Feather of Ma'at on right pan (truth/judgment) -->
  <g transform="translate(125, 50)" filter="url(#jewelGlow)">
    <!-- Feather shaft -->
    <line x1="0" y1="20" x2="0" y2="-15" stroke="#d4af37" stroke-width="2"/>
    <!-- Feather vanes (left) -->
    <path d="M 0 15 Q -6 12 -8 5 Q -6 8 0 10" fill="#FFD700" opacity="0.7"/>
    <path d="M 0 8 Q -7 5 -10 -2 Q -7 2 0 5" fill="#FFD700" opacity="0.7"/>
    <path d="M 0 0 Q -8 -3 -10 -10 Q -8 -5 0 -5" fill="#FFD700" opacity="0.8"/>
    <!-- Feather vanes (right) -->
    <path d="M 0 15 Q 6 12 8 5 Q 6 8 0 10" fill="#FFD700" opacity="0.7"/>
    <path d="M 0 8 Q 7 5 10 -2 Q 7 2 0 5" fill="#FFD700" opacity="0.7"/>
    <path d="M 0 0 Q 8 -3 10 -10 Q 8 -5 0 -5" fill="#FFD700" opacity="0.8"/>
    <!-- Center highlight -->
    <circle cx="0" cy="-5" r="2" fill="#d4af37" opacity="0.9"/>
  </g>
  
  <!-- Decorative corners (authority sigils) -->
  <circle cx="20" cy="20" r="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <circle cx="180" cy="20" r="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <circle cx="20" cy="180" r="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
  <circle cx="180" cy="180" r="8" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
</svg>
