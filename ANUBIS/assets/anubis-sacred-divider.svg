<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b88a2a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b88a2a;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadowEffect">
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Left Anubis head (profile) -->
  <g transform="translate(40, 40)" filter="url(#shadowEffect)">
    <!-- Head outline -->
    <ellipse cx="0" cy="0" rx="20" ry="22" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
    <!-- Snout outline -->
    <path d="M 18 -3 Q 30 -5 35 0" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    <!-- Ear outline -->
    <path d="M 8 -18 L 2 -28 L 6 -18" fill="none" stroke="#d4af37" stroke-width="1"/>
  </g>
  
  <!-- Central ankh symbol (sacred) -->
  <g transform="translate(150, 40)" filter="url(#shadowEffect)">
    <!-- Loop (circle) -->
    <circle cx="0" cy="-8" r="12" fill="none" stroke="url(#goldStroke)" stroke-width="2"/>
    <!-- Staff (vertical) -->
    <line x1="0" y1="8" x2="0" y2="25" stroke="url(#goldStroke)" stroke-width="2"/>
    <!-- Arms (horizontal) -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="url(#goldStroke)" stroke-width="2"/>
  </g>
  
  <!-- Right Anubis head (profile mirror) -->
  <g transform="translate(260, 40) scale(-1, 1)" filter="url(#shadowEffect)">
    <!-- Head outline -->
    <ellipse cx="0" cy="0" rx="20" ry="22" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.8"/>
    <!-- Snout outline -->
    <path d="M 18 -3 Q 30 -5 35 0" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    <!-- Ear outline -->
    <path d="M 8 -18 L 2 -28 L 6 -18" fill="none" stroke="#d4af37" stroke-width="1"/>
  </g>
</svg>
