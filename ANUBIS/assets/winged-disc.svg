<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Winged Sun Disc - Egyptian Motif -->
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1"/>
    </linearGradient>
  </defs>
  
  <!-- Left Wing -->
  <path d="M 50 50 Q 30 35 20 50 Q 30 65 50 50" fill="url(#wingGrad)" stroke="#0A0A0A" stroke-width="1.5"/>
  
  <!-- Left Wing Details -->
  <path d="M 45 45 Q 35 40 28 48" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  <path d="M 45 50 Q 35 50 28 50" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  <path d="M 45 55 Q 35 60 28 52" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  
  <!-- Central Disc -->
  <circle cx="100" cy="50" r="25" fill="url(#discGrad)" stroke="#0A0A0A" stroke-width="2"/>
  
  <!-- Uraeus (Serpent) in Disc -->
  <path d="M 85 50 Q 100 40 115 50" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="85" cy="50" r="1.5" fill="#0A0A0A"/>
  <circle cx="115" cy="50" r="1.5" fill="#0A0A0A"/>
  
  <!-- Right Wing -->
  <path d="M 150 50 Q 170 35 180 50 Q 170 65 150 50" fill="url(#wingGrad)" stroke="#0A0A0A" stroke-width="1.5"/>
  
  <!-- Right Wing Details -->
  <path d="M 155 45 Q 165 40 172 48" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  <path d="M 155 50 Q 165 50 172 50" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  <path d="M 155 55 Q 165 60 172 52" stroke="#0A0A0A" stroke-width="0.8" fill="none"/>
  
  <!-- Bottom Beam -->
  <line x1="100" y1="75" x2="100" y2="90" stroke="#D4AF37" stroke-width="2"/>
  <circle cx="100" cy="78" r="2" fill="#FFD700"/>
</svg>
