<svg viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Cartouche Frame - Egyptian Motif (for cards/modals) -->
  <defs>
    <linearGradient id="cartoucheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:0.8"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Frame -->
  <g transform="translate(50, 60)">
    <!-- Oval Body -->
    <ellipse cx="0" cy="0" rx="40" ry="55" fill="none" stroke="url(#cartoucheGrad)" stroke-width="2.5"/>
    
    <!-- Top Loop -->
    <path d="M -30 -50 Q -30 -65 0 -65 Q 30 -65 30 -50" fill="none" stroke="url(#cartoucheGrad)" stroke-width="2.5"/>
    
    <!-- Bottom Line Closure -->
    <line x1="-35" y1="55" x2="35" y2="55" stroke="url(#cartoucheGrad)" stroke-width="2.5"/>
    
    <!-- Decorative Line -->
    <line x1="-35" y1="-55" x2="35" y2="-55" stroke="url(#cartoucheGrad)" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Inner Frame Line -->
    <ellipse cx="0" cy="0" rx="36" ry="50" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
