<svg viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="scepterGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left Scepter -->
  <g>
    <!-- Handle -->
    <rect x="15" y="45" width="50" height="8" fill="url(#scepterGold)" rx="4"/>
    <!-- Crook head - curved -->
    <path d="M 20 40 Q 15 35 20 30 Q 30 25 35 30 Q 40 35 35 40" fill="url(#scepterGold)" stroke="#070708" stroke-width="1"/>
    <!-- Decorative bulbs -->
    <circle cx="18" cy="32" r="3" fill="#d4af37"/>
    <circle cx="32" cy="32" r="3" fill="#d4af37"/>
  </g>
  
  <!-- Center Ornament -->
  <circle cx="150" cy="60" r="20" fill="url(#scepterGold)" stroke="#070708" stroke-width="2"/>
  <circle cx="150" cy="60" r="14" fill="#070708"/>
  <circle cx="150" cy="60" r="8" fill="url(#scepterGold)"/>
  
  <!-- Inner star -->
  <g transform="translate(150, 60)">
    <path d="M 0,-6 L 1.5,-2 L 6,-1.5 L 3,1.5 L 4.5,6 L 0,3 L -4.5,6 L -3,1.5 L -6,-1.5 L -1.5,-2 Z" 
          fill="#070708" opacity="0.8"/>
  </g>
  
  <!-- Right Scepter (mirror) -->
  <g>
    <!-- Handle -->
    <rect x="235" y="45" width="50" height="8" fill="url(#scepterGold)" rx="4"/>
    <!-- Crook head -->
    <path d="M 280 40 Q 285 35 280 30 Q 270 25 265 30 Q 260 35 265 40" fill="url(#scepterGold)" stroke="#070708" stroke-width="1"/>
    <!-- Decorative bulbs -->
    <circle cx="282" cy="32" r="3" fill="#d4af37"/>
    <circle cx="268" cy="32" r="3" fill="#d4af37"/>
  </g>
  
  <!-- Connecting lines -->
  <line x1="40" y1="60" x2="130" y2="60" stroke="url(#scepterGold)" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="60" x2="260" y2="60" stroke="url(#scepterGold)" stroke-width="2" opacity="0.6"/>
</svg>