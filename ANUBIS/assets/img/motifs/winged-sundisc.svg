<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b88a2a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left Wing -->
  <path d="M 50 50 Q 30 40 20 50 Q 30 60 50 50" 
        fill="url(#wingGrad)" stroke="#070708" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Left Wing Inner Detail -->
  <path d="M 48 48 Q 35 43 28 50 Q 35 55 48 52" 
        fill="#070708" opacity="0.3" stroke="none"/>
  
  <!-- Central Disc -->
  <circle cx="100" cy="50" r="25" fill="url(#wingGrad)" stroke="#070708" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner Ring -->
  <circle cx="100" cy="50" r="20" fill="none" stroke="#070708" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Serpent/Uraeus in disc -->
  <path d="M 85 50 Q 100 40 115 50" 
        stroke="#070708" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Serpent head details -->
  <circle cx="85" cy="50" r="2.5" fill="#070708"/>
  <circle cx="115" cy="50" r="2.5" fill="#070708"/>
  
  <!-- Right Wing -->
  <path d="M 150 50 Q 170 40 180 50 Q 170 60 150 50" 
        fill="url(#wingGrad)" stroke="#070708" stroke-width="1.5" filter="url(#glow)"/>
  
  <!-- Right Wing Inner Detail -->
  <path d="M 152 48 Q 165 43 172 50 Q 165 55 152 52" 
        fill="#070708" opacity="0.3" stroke="none"/>
  
  <!-- Feather lines (left) -->
  <line x1="45" y1="48" x2="38" y2="42" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
  <line x1="42" y1="50" x2="30" y2="50" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
  <line x1="45" y1="52" x2="38" y2="58" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
  
  <!-- Feather lines (right) -->
  <line x1="155" y1="48" x2="162" y2="42" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
  <line x1="158" y1="50" x2="170" y2="50" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
  <line x1="155" y1="52" x2="162" y2="58" stroke="#070708" stroke-width="0.8" opacity="0.4"/>
</svg>