<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Ibrahem Kassap</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-content {
            max-width: 600px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue) 0%, #64a8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 32px;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .error-description {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 40px;
        }
        .error-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Portfolio.</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="error-page">
        <div class="error-content">
            <h1 class="error-code">404</h1>
            <h2 class="error-message">Oops! Page Not Found</h2>
            <p class="error-description">
                The page you're looking for doesn't exist or has been moved. 
                Let's get you back on track!
            </p>
            <div class="error-links">
                <a href="index.html" class="btn">
                    <i class='bx bx-home'></i> Go Home
                </a>
                <a href="portfolio.html" class="btn btn-secondary">
                    <i class='bx bx-briefcase'></i> View Portfolio
                </a>
                <a href="contact.html" class="btn btn-secondary">
                    <i class='bx bx-envelope'></i> Contact Me
                </a>
            </div>
        </div>
    </section>

    <script src="main.js"></script>
</body>
</html>
